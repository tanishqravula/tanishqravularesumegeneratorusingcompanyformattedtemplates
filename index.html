<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Resume Generator · Company-Inspired Themes</title>

<!-- ============================================================
     APP CHROME STYLES (not exported with the resume)
     ============================================================ -->
<style id="appCss">
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:#0b1020;color:#e6ecf7;line-height:1.45;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
:focus-visible{outline:2px solid #7aa2ff;outline-offset:2px;border-radius:6px}
a{color:#9fc0ff}
h1,h2,h3,h4{margin:0}

/* ---------- App bar ---------- */
.app-bar{
  position:sticky;top:0;z-index:60;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 16px;min-height:56px;
  background:rgba(11,16,32,.94);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-bottom:1px solid #1b2439;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;letter-spacing:.2px}
.brand .mark{
  width:28px;height:28px;border-radius:9px;
  background:linear-gradient(135deg,#5b8cff,#a855f7);
  display:grid;place-items:center;font-size:14px;color:#fff;flex:0 0 auto;
}
.brand .txt{display:flex;flex-direction:column;line-height:1.1}
.brand .txt small{font-weight:500;font-size:10.5px;color:#8e9ab5;letter-spacing:.4px}
.spacer{flex:1 1 auto}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid #2a3652;background:#151d2f;color:#dbe4f5;
  padding:8px 13px;border-radius:10px;font-size:13px;font-weight:600;
  cursor:pointer;font-family:inherit;white-space:nowrap;
  transition:background .18s,transform .12s,border-color .18s,box-shadow .18s,color .18s;
}
.btn:hover{background:#1c2740;border-color:#3a4a70}
.btn:active{transform:translateY(1px)}
.btn-primary{background:linear-gradient(135deg,#4f7cff,#7c4dff);border-color:transparent;color:#fff}
.btn-primary:hover{background:linear-gradient(135deg,#5f89ff,#8b5cff)}
.btn-ghost{background:transparent;border-color:#243050}
.btn-ghost:hover{background:#161f34}
.btn-danger{background:#2a1620;border-color:#5a2333;color:#ffb3c4}
.btn-danger:hover{background:#3a1b29}
.btn-sm{padding:5px 9px;font-size:11.5px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* ---------- Shell ---------- */
.app-shell{display:flex;align-items:flex-start}
.builder{
  flex:0 0 44%;max-width:640px;min-width:340px;
  height:calc(100vh - 57px);overflow-y:auto;overscroll-behavior:contain;
  padding:14px 14px 80px;border-right:1px solid #1b2439;background:#0d1322;
}
.preview-pane{
  flex:1 1 auto;min-width:0;
  height:calc(100vh - 57px);overflow-y:auto;overscroll-behavior:contain;
  padding:0 18px 90px;background:#e9edf5;
}

/* ---------- Builder nav ---------- */
.builder-nav{
  position:sticky;top:-14px;z-index:20;margin:-14px -14px 12px;padding:12px 14px 10px;
  background:linear-gradient(180deg,#0d1322 70%,rgba(13,19,34,.75));
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;
  border-bottom:1px solid #1b2439;
}
.nav-chip{
  border:1px solid #243050;background:#131c2e;color:#a9b8d4;
  border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:600;
  cursor:pointer;white-space:nowrap;font-family:inherit;transition:.18s;
}
.nav-chip:hover{background:#1a2740;color:#dce6fb;border-color:#35496f}

/* ---------- Cards ---------- */
.card{
  background:#111a2b;border:1px solid #1e2941;border-radius:14px;
  padding:14px;margin-bottom:12px;box-shadow:0 1px 0 rgba(255,255,255,.02);
}
.card-title{
  font-size:13.5px;font-weight:800;letter-spacing:.3px;color:#eaf1ff;
  display:flex;align-items:center;gap:8px;margin-bottom:10px;
}
.card-title .idx{
  width:20px;height:20px;border-radius:6px;background:#1d2a44;color:#8fb0ff;
  display:grid;place-items:center;font-size:11px;flex:0 0 auto;
}
.hint{font-size:11px;color:#7d8dab;margin:4px 0 8px;line-height:1.4}
.note-banner{
  background:#14203a;border:1px solid #24345a;border-radius:12px;padding:10px 12px;
  font-size:11.5px;color:#a9bcdd;margin-bottom:12px;line-height:1.5;
}

/* ---------- Fields ---------- */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;min-width:0}
.field label{font-size:11.5px;font-weight:700;color:#a9b8d4;letter-spacing:.2px}
.field input,.field textarea,.tagrow input,.tb-select,.custom-input{
  width:100%;background:#0c1526;border:1px solid #26324d;color:#e8eefc;
  border-radius:9px;padding:8px 10px;font-size:12.5px;font-family:inherit;
  transition:border-color .16s,background .16s;resize:vertical;
}
.field input::placeholder,.field textarea::placeholder,.tagrow input::placeholder{color:#5a6a88}
.field input:focus,.field textarea:focus,.tagrow input:focus{
  outline:none;border-color:#4f7cff;background:#0e1930;
}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:8px;font-size:12px;color:#b9c7e2;font-weight:600;margin:2px 0 10px;cursor:pointer}
.check input{width:15px;height:15px;accent-color:#5b8cff;cursor:pointer}

/* ---------- Repeater items ---------- */
.rep-item{
  border:1px solid #1f2b45;background:#0e1728;border-radius:12px;
  padding:11px;margin-bottom:9px;
}
.rep-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.rep-title{font-size:11.5px;font-weight:800;color:#8fb0ff;letter-spacing:.5px;text-transform:uppercase}
.add-btn{width:100%;justify-content:center;border-style:dashed}

/* ---------- Tag input ---------- */
.tagbox{border:1px solid #1f2b45;background:#0e1728;border-radius:11px;padding:9px;margin-bottom:9px}
.tagbox-label{font-size:11px;font-weight:800;color:#9db2d8;margin-bottom:6px;letter-spacing:.4px;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chips:empty{display:none}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  background:#1b2a48;border:1px solid #2c4066;color:#cfe0ff;
  border-radius:999px;padding:3px 5px 3px 10px;font-size:11.5px;font-weight:600;
  max-width:100%;overflow-wrap:anywhere;
}
.chip-x{
  border:none;background:#2b3f66;color:#dbe8ff;width:16px;height:16px;line-height:1;
  border-radius:50%;cursor:pointer;font-size:12px;display:grid;place-items:center;
  padding:0;flex:0 0 auto;font-family:inherit;
}
.chip-x:hover{background:#e0556f;color:#fff}
.tagrow{display:flex;gap:7px}
.tagrow input{flex:1 1 auto;min-width:0}

/* ---------- Theme panel ---------- */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-top:6px}
.theme-card{
  border:1px solid #24304c;border-radius:12px;padding:7px;background:#121a2b;
  cursor:pointer;text-align:left;color:#dbe4f5;font-size:11.5px;font-weight:700;
  transition:.18s;display:flex;flex-direction:column;gap:6px;font-family:inherit;
}
.theme-card:hover{border-color:#3d4f7a;background:#182238;transform:translateY(-1px)}
.theme-card[aria-pressed="true"]{border-color:#7aa2ff;box-shadow:0 0 0 2px rgba(122,162,255,.25)}
.theme-swatch{height:24px;border-radius:7px;display:flex;overflow:hidden;border:1px solid rgba(255,255,255,.09)}
.theme-swatch i{flex:1}
.custom-panel{margin-top:12px;border-top:1px dashed #24304c;padding-top:10px}
.custom-panel[hidden]{display:none}

/* ---------- Preview toolbar ---------- */
.preview-toolbar{
  position:sticky;top:0;z-index:30;
  margin:0 -18px 16px;padding:11px 18px;
  background:rgba(255,255,255,.94);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid #dbe1ec;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
}
.tb-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:#fff;border:1px solid #d3dae7;color:#1c2438;
  border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:700;
  cursor:pointer;font-family:inherit;white-space:nowrap;transition:.16s;
}
.tb-btn:hover{background:#f3f6fc;border-color:#b9c5da}
.tb-btn.primary{background:#1c2438;border-color:#1c2438;color:#fff}
.tb-btn.primary:hover{background:#293349}
.tb-select{
  width:auto;background:#fff;border:1px solid #d3dae7;color:#1c2438;
  border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:700;cursor:pointer;
}
.tb-toggle{
  display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;
  color:#1c2438;background:#fff;border:1px solid #d3dae7;border-radius:9px;
  padding:7px 11px;cursor:pointer;white-space:nowrap;
}
.tb-toggle input{accent-color:#4f7cff;width:15px;height:15px;cursor:pointer}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,26px);
  background:#101827;color:#e8eefc;border:1px solid #2a3category;
  border:1px solid #2a3652;border-radius:12px;padding:11px 18px;font-size:13px;font-weight:600;
  box-shadow:0 18px 44px rgba(0,0,0,.5);opacity:0;pointer-events:none;
  transition:opacity .24s,transform .24s;z-index:200;max-width:min(90vw,520px);text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Mobile tabs ---------- */
.mobile-tabs{display:none;gap:6px}
.mobile-tabs button{
  border:1px solid #243050;background:#131c2e;color:#a9b8d4;border-radius:9px;
  padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;
}
.mobile-tabs button.active{background:#2b3d63;color:#fff;border-color:#4f7cff}

/* ---------- Mode handling ---------- */
body[data-mode="resume"] .builder{display:none}
body[data-mode="resume"] .preview-pane{flex:1 1 100%}

/* ---------- Responsive ---------- */
@media (max-width:1250px){
  .builder{flex:0 0 46%;max-width:none;min-width:0}
}
@media (max-width:940px){
  .mobile-tabs{display:flex}
  .app-shell{display:block}
  .builder,.preview-pane{height:auto;max-width:none;min-width:0;border-right:none}
  .builder{padding-bottom:60px}
  .preview-pane{padding-bottom:60px}
  body[data-mode="split"][data-mobile-view="builder"] .preview-pane{display:none}
  body[data-mode="split"][data-mobile-view="preview"] .builder{display:none}
  body[data-mode="resume"] .builder{display:none}
  .preview-toolbar{margin:0 -14px 14px;padding:10px 14px}
  .preview-pane{padding-left:14px;padding-right:14px}
  .grid-2,.grid-3{grid-template-columns:1fr}
}
@media (max-width:560px){
  .brand .txt small{display:none}
  .btn{padding:7px 10px;font-size:12px}
  .tb-btn,.tb-toggle,.tb-select{font-size:11.5px;padding:6px 9px}
}

/* ---------- Print ---------- */
@media print{
  @page{size:A4;margin:10mm}
  html,body{background:#fff !important;height:auto !important;margin:0 !important;padding:0 !important}
  .app-bar,.builder,.preview-toolbar,.toast,.mobile-tabs{display:none !important}
  .app-shell{display:block !important}
  .preview-pane{
    height:auto !important;overflow:visible !important;padding:0 !important;
    background:#fff !important;display:block !important;
  }
  #resumeHost{display:block !important}
  .resume{
    box-shadow:none !important;border-radius:0 !important;
    max-width:none !important;width:100% !important;margin:0 !important;overflow:visible !important;
  }
  .r-section,.r-item,.exp-item,.proj-item,.edu-item,.diagram,.r-header{
    break-inside:avoid;page-break-inside:avoid;
  }
  .r-name,.r-h2,.r-h3{break-after:avoid;page-break-after:avoid}
  *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
}

/* ---------- Utility ---------- */
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
</style>

<!-- ============================================================
     RESUME DOCUMENT STYLES (exported with the resume)
     ============================================================ -->
<style id="resumeCss">
/* ============ RESUME ROOT ============ */
.resume{
  --r-bg:#ffffff; --r-surface:#f6f8fb; --r-text:#151a24; --r-muted:#5b6472;
  --r-accent:#2f6bff; --r-accent2:#111827; --r-border:#e4e8ef;
  --r-header-bg:#111827; --r-header-text:#ffffff;
  --r-chip-bg:#eef3ff; --r-chip-text:#22407f;
  --r-font:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --r-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
  --r-radius:6px;

  width:100%;max-width:880px;margin:0 auto;
  background:var(--r-bg);color:var(--r-text);
  font-family:var(--r-font);font-size:12.4px;line-height:1.5;
  border-radius:10px;box-shadow:0 12px 44px rgba(15,23,42,.16);
  overflow-wrap:break-word;word-break:normal;
  box-sizing:border-box;overflow:hidden;
}
.resume *{box-sizing:border-box}
.resume p{margin:0 0 6px}
.resume ul{margin:0;padding:0;list-style:none}

/* ============ HEADER ============ */
.r-header{padding:22px 26px;position:relative}
.r-head-inner{display:flex;gap:20px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.r-head-left{display:flex;gap:14px;align-items:flex-start;min-width:0;flex:1 1 260px}
.r-photo{
  width:78px;height:78px;object-fit:cover;border-radius:var(--r-radius);
  border:2px solid var(--r-accent);flex:0 0 auto;background:var(--r-surface);
}
.r-namebox{min-width:0}
.r-name{font-size:29px;line-height:1.12;font-weight:800;letter-spacing:-.5px;color:inherit;overflow-wrap:break-word}
.r-title{
  margin-top:5px;font-size:12px;font-weight:700;letter-spacing:1.2px;
  text-transform:uppercase;opacity:.88;color:inherit;overflow-wrap:break-word;
}
.r-contacts{display:flex;flex-wrap:wrap;gap:5px 15px;font-size:11.4px;max-width:100%}
.r-head-right{flex:0 1 auto;min-width:0;max-width:100%}
.r-contact{
  display:inline-flex;align-items:center;gap:5px;color:inherit;text-decoration:none;
  max-width:100%;overflow-wrap:anywhere;word-break:break-word;
}
.r-contact:hover{text-decoration:underline}
.r-contact svg{width:12.5px;height:12.5px;flex:0 0 auto;opacity:.85}
.r-contact-plain{display:inline-block;max-width:100%;overflow-wrap:anywhere}

.resume[data-header="band"] .r-header{background:var(--r-header-bg);color:var(--r-header-text)}
.resume[data-header="minimal"] .r-header{
  background:transparent;color:var(--r-text);
  border-bottom:2px solid var(--r-accent);padding:24px 26px 16px;
}
.resume[data-header="left"] .r-header{
  background:var(--r-bg);color:var(--r-text);border-left:6px solid var(--r-accent);padding:20px 26px;
}
.resume[data-header="gradient"] .r-header{
  background:linear-gradient(120deg,var(--r-accent) 0%,var(--r-accent2) 100%);
  color:#ffffff;padding:24px 26px;
}
.resume[data-header="ats"] .r-header{
  background:transparent;color:var(--r-text);padding:0 0 10px;border-bottom:1px solid var(--r-text);
}
.resume[data-header="ats"] .r-title{opacity:1;letter-spacing:.6px}
.resume[data-flag="gbar"] .r-header::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:4px;
  background:linear-gradient(90deg,#4285f4 0 25%,#ea4335 25% 50%,#fbbc05 50% 75%,#34a853 75% 100%);
}
.resume[data-flag="gbar"] .r-header{padding-bottom:26px}

/* ============ BODY / LAYOUT ============ */
.r-body{padding:20px 26px 28px}
.r-body.r-body-single{display:block}
.resume[data-layout="sidebar"] .r-body{
  display:grid;grid-template-columns:minmax(160px,215px) minmax(0,1fr);
  gap:24px;align-items:start;
}
.resume[data-layout="sidebar"] .r-body.r-body-single{grid-template-columns:minmax(0,1fr)}
.r-col{min-width:0}
.r-main{min-width:0}
.r-side{min-width:0}

/* ============ SECTIONS ============ */
.r-section{margin:0 0 17px}
.r-section:last-child{margin-bottom:0}
.r-h2{
  font-size:11.4px;font-weight:800;letter-spacing:1.15px;text-transform:uppercase;
  color:var(--r-text);margin:0 0 9px;display:flex;align-items:center;gap:9px;
  line-height:1.3;
}
.resume[data-flag="code"] .r-h2{font-family:var(--r-mono);letter-spacing:.6px}
.resume[data-divider="bar"] .r-h2::after{
  content:'';flex:1 1 auto;height:2px;border-radius:2px;
  background:var(--r-accent);opacity:.55;min-width:16px;
}
.resume[data-divider="thin"] .r-h2{border-bottom:1px solid var(--r-border);padding-bottom:6px}
.resume[data-divider="dashed"] .r-h2{border-bottom:1px dashed var(--r-border);padding-bottom:6px}
.resume[data-divider="plain"] .r-h2{border-bottom:1px solid var(--r-text);padding-bottom:4px;letter-spacing:.9px}
.resume[data-divider="dashed"] .r-h2::after{display:none}

.r-para{margin:0 0 6px;font-size:12.2px;line-height:1.55;overflow-wrap:break-word}
.r-note{font-size:10.6px;color:var(--r-muted);margin:-3px 0 8px;font-style:italic}

/* ============ ITEMS ============ */
.r-item{margin-bottom:13px;min-width:0}
.r-item:last-child{margin-bottom:0}
.r-item-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.r-item-left{min-width:0;flex:1 1 200px}
.r-item-right{flex:0 0 auto;text-align:right}
.r-h3{
  font-size:13.2px;font-weight:800;color:var(--r-text);margin:0 0 2px;
  line-height:1.3;overflow-wrap:break-word;
}
.r-org{font-size:11.8px;font-weight:700;color:var(--r-accent2);overflow-wrap:break-word}
.r-date{
  font-size:10.8px;font-weight:700;color:var(--r-muted);white-space:nowrap;
  font-family:var(--r-mono);letter-spacing:.2px;
}
.resume[data-layout="sidebar"] .r-item-head{flex-direction:column;gap:1px}
.resume[data-layout="sidebar"] .r-item-right{text-align:left}

.r-ul{margin:4px 0 0;padding:0}
.r-ul li{
  position:relative;padding-left:14px;margin-bottom:3px;font-size:12.1px;
  line-height:1.5;overflow-wrap:break-word;
}
.r-ul li::before{
  content:'';position:absolute;left:3px;top:7px;width:4px;height:4px;
  border-radius:50%;background:var(--r-accent);
}
.r-list-plain li{padding-left:0}
.r-list-plain li::before{display:none}

.r-tech{
  margin-top:5px;display:flex;flex-wrap:wrap;align-items:center;gap:5px;
  font-size:10.8px;
}
.r-tech-label{font-weight:800;color:var(--r-muted);letter-spacing:.4px;text-transform:uppercase}
.r-tech-item{
  background:var(--r-surface);border:1px solid var(--r-border);
  border-radius:999px;padding:1px 8px;color:var(--r-muted);font-weight:600;
  max-width:100%;overflow-wrap:anywhere;
}
.r-link{
  display:inline-block;font-size:11px;color:var(--r-accent);text-decoration:none;
  overflow-wrap:anywhere;word-break:break-word;max-width:100%;
}
.r-link:hover{text-decoration:underline}

/* ============ SKILLS ============ */
.skill-list{display:flex;flex-direction:column;gap:6px}
.skill-row{display:flex;gap:9px;align-items:flex-start;flex-wrap:wrap;min-width:0}
.skill-cat{
  font-size:10.6px;font-weight:800;color:var(--r-muted);letter-spacing:.5px;
  text-transform:uppercase;flex:0 0 auto;min-width:0;
}
.resume[data-layout="sidebar"] .skill-row{flex-direction:column;gap:3px}
.skill-chips{display:flex;flex-wrap:wrap;gap:4px;min-width:0;flex:1 1 auto}
.skill-chip{
  background:var(--r-chip-bg);color:var(--r-chip-text);border-radius:var(--r-radius);
  padding:1px 7px;font-size:11px;font-weight:600;border:1px solid var(--r-border);
  max-width:100%;overflow-wrap:anywhere;
}
.ats-line{font-size:12.1px;margin:0 0 4px;overflow-wrap:break-word}

/* ============ DIAGRAM ============ */
.diagram{
  position:relative;width:100%;height:auto;
  border:1px solid var(--r-border);background:var(--r-surface);
  border-radius:8px;padding:10px 12px;margin-top:8px;min-width:0;
}
.dg-title{
  font-size:10px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;
  color:var(--r-muted);margin-bottom:8px;
}
.dg-flow{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.dg-node{
  display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap;
  font-size:10.8px;font-weight:700;padding:3px 10px;border-radius:6px;
  background:var(--r-chip-bg);color:var(--r-chip-text);
  border:1px solid var(--r-border);max-width:100%;overflow-wrap:anywhere;
}
.dg-note{font-weight:600;opacity:.8;font-size:10px}
.dg-arrow{font-size:11px;line-height:1.05;color:var(--r-muted);padding-left:15px}
.dg-branches{
  display:flex;flex-wrap:wrap;gap:5px;padding-left:22px;margin:3px 0 1px;min-width:0;
}
.dg-branch{
  font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;
  background:var(--r-bg);border:1px dashed var(--r-border);color:var(--r-muted);
  max-width:100%;overflow-wrap:anywhere;
}

/* ============ MISC ============ */
.r-two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px}
.resume[data-layout="sidebar"] .r-two-col{grid-template-columns:1fr}
.r-kv{font-size:11.8px;line-height:1.5;overflow-wrap:break-word}
.r-kv strong{font-weight:800}

@media (max-width:640px){
  .resume{font-size:12px;border-radius:0}
  .r-header{padding:18px}
  .r-body{padding:16px 18px 22px}
  .resume[data-layout="sidebar"] .r-body{grid-template-columns:1fr;gap:16px}
  .r-name{font-size:23px}
  .r-item-head{flex-direction:column;gap:1px}
  .r-item-right{text-align:left}
  .r-two-col{grid-template-columns:1fr}
}

@media print{
  .resume{box-shadow:none !important;border-radius:0 !important;max-width:none !important;width:100% !important}
  .resume[data-layout="sidebar"] .r-body{grid-template-columns:minmax(150px,200px) minmax(0,1fr)}
}

<body data-mode="split" data-mobile-view="builder">

<!-- ============ APP BAR ============ -->
<header class="app-bar">
  <div class="brand">
    <span class="mark" aria-hidden="true">R</span>
    <span class="txt">
      Resume Generator
      <small>Company-inspired themes · 100% client-side</small>
    </span>
  </div>

  <button type="button" class="btn btn-danger" id="btnClear">Clear</button>
  <button type="button" class="btn btn-primary" id="btnGenerate">Generate Resume</button>
</header>

<!-- ============ SHELL ============ -->
<div class="app-shell">

      endorsed by, or an official template of any company listed. No company logos or trademarks are used.
    </div>
    <div id="builderSections"></div>
  </aside>

  <!-- ---------- PREVIEW ---------- -->
  <main class="preview-pane" id="previewPane" aria-label="Resume preview">
    <div class="preview-toolbar">
      <button type="button" class="tb-btn primary" id="btnPreviewMode">Preview Mode</button>
      <button type="button" class="tb-btn" id="btnEditMode">Edit Information</button>

      <label class="tb-toggle" for="atsToggle">
        <input type="checkbox" id="atsToggle" />

      <span class="spacer"></span>

      <label class="sr-only" for="themeSelect">Resume theme</label>
      <select class="tb-select" id="themeSelect"></select>

      <button type="button" class="tb-btn" id="btnPrint">Print / Export PDF</button>
      <button type="button" class="tb-btn" id="btnDownload">Download Resume HTML</button>
    </div>

    <div id="resumeHost"></div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

  if (attrs) {
    Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];

    if (c === null || c === undefined || c === false) return;

}

function esc(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {

/** Return a safe, clickable URL or an empty string. */
function sanitizeUrl(u) {
  var s = String(u || '').trim();
  if (!s) return '';
  if (/^(https?:|mailto:|tel:)/i.test(s)) return s;
  if (/^[\w.-]+\.[a-z]{2,}([/?#].*)?$/i.test(s)) return 'https://' + s;
  if (/^www\./i.test(s)) return 'https://' + s;
  return '';
}

/** Trim a URL for display. */
function prettyUrl(u) {
  return String(u || '')

}

function debounce(fn, ms) {
  var t = null;
  return function () {
    var args = arguments, ctx = this;
    clearTimeout(t);
    t = setTimeout(function () { fn.apply(ctx, args); }, ms);

function getPath(obj, path) {
  return path.split('.').reduce(function (o, k) {
    return (o === null || o === undefined) ? undefined : o[k];

}

function setPath(obj, path, val) {
  var parts = path.split('.');

  for (var i = 0; i < parts.length - 1; i++) {

    if (cur[k] === null || cur[k] === undefined) cur[k] = {};

function lines(str) {

function hexToRgb(hex) {
  var s = String(hex || '').replace('#', '').trim();
  if (s.length === 3) s = s.split('').map(function (c) { return c + c; }).join('');
  if (!/^[0-9a-f]{6}$/i.test(s)) s = '4f46e5';

    g: parseInt(s.slice(2, 4), 16),
    b: parseInt(s.slice(4, 6), 16)

  function c(n) {

  return '#' + c(r) + c(g) + c(b);

  var c = hexToRgb(hex);
  var target = percent > 0 ? 255 : 0;
  var p = Math.min(Math.abs(percent), 100) / 100;
  return rgbToHex(
    c.r + (target - c.r) * p,
    c.g + (target - c.g) * p,
    c.b + (target - c.b) * p
  );

function luminance(hex) {
  var c = hexToRgb(hex);
  return (0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b) / 255;

function emptyState() {
  var skills = {};
  SKILL_CATEGORIES.forEach(function (c) { skills[c] = []; });
  return {
    meta: {
      themeId: 'amazon',
      ats: false,
      custom: {
        primary: '#4f46e5', secondary: '#111827', bg: '#ffffff', text: '#151a24',
        font: 'sans', layout: 'single', divider: 'bar'
      }
    },
    personal: {
      name: '', title: '', email: '', phone: '', location: '',
      linkedin: '', github: '', portfolio: '', photo: ''
    },
    summary: '',
    skills: skills,
    experience: [],
    education: [],
    projects: [],
    certifications: [],
    achievements: [],
    publications: [],
    languages: [],
    custom: []
  };
}

var EXPERIENCE_TEMPLATE = {
  company: '', title: '', location: '', start: '', end: '',
  current: false, description: '', achievements: '', technologies: ''
};
var EDUCATION_TEMPLATE = {
  degree: '', university: '', location: '', startYear: '', endYear: '', gpa: '', coursework: ''
};
var PROJECT_TEMPLATE = {
  name: '', description: '', technologies: '', architecture: '', contributions: '', url: ''
};
var CUSTOM_TEMPLATE = { title: '', content: '' };

function normalizeArray(arr, template) {
  if (!Array.isArray(arr)) return [];
  return arr.map(function (item) {
    var out = Object.assign({}, template);
    if (item && typeof item === 'object') {
      Object.keys(item).forEach(function (k) { out[k] = item[k]; });
    }
    return out;
  });
}

function normalizeStringArray(arr) {
  if (!Array.isArray(arr)) return [];
  return arr.map(function (s) { return typeof s === 'string' ? s : String(s == null ? '' : s); });
}

function hydrate(o) {
  var base = emptyState();
  var src = (o && typeof o === 'object') ? o : {};
  var out = Object.assign(base, src);

  out.meta = Object.assign({}, base.meta, src.meta || {});
  out.meta.custom = Object.assign({}, base.meta.custom, (src.meta && src.meta.custom) || {});
  out.personal = Object.assign({}, base.personal, src.personal || {});

  var mergedSkills = {};
  SKILL_CATEGORIES.forEach(function (c) {
    mergedSkills[c] = normalizeStringArray((src.skills && src.skills[c]) || []);
  });
  out.skills = mergedSkills;

  out.experience     = normalizeArray(src.experience, EXPERIENCE_TEMPLATE);
  out.education      = normalizeArray(src.education, EDUCATION_TEMPLATE);
  out.projects       = normalizeArray(src.projects, PROJECT_TEMPLATE);
  out.custom         = normalizeArray(src.custom, CUSTOM_TEMPLATE);
  out.certifications = normalizeStringArray(src.certifications);
  out.achievements   = normalizeStringArray(src.achievements);
  out.publications   = normalizeStringArray(src.publications);
  out.languages      = normalizeStringArray(src.languages);
  out.summary        = typeof src.summary === 'string' ? src.summary : '';

  if (!THEMES[out.meta.themeId] && out.meta.themeId !== 'custom') out.meta.themeId = 'amazon';
  return out;
}

var state = emptyState();

function saveResume(silent) {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    if (!silent) toast('Resume saved to this browser.');
    return true;
  } catch (e) {
    if (!silent) toast('Could not save — browser storage is full or unavailable.');
    return false;
  }
}

function loadResume(silent) {
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (!raw) {
      if (!silent) toast('No saved resume found in this browser.');
      return false;
    }
    var parsed = JSON.parse(raw);
    state = hydrate(parsed);
    renderBuilder();
    renderPreview();
    syncThemeUI();
    if (!silent) toast('Saved resume loaded.');
    return true;
  } catch (e) {
    if (!silent) toast('Saved data could not be read.');
    return false;
  }
}

function clearResume() {
  try { localStorage.removeItem(LS_KEY); } catch (e) { /* ignore */ }
  state = emptyState();
  renderBuilder();
  renderPreview();
  syncThemeUI();
  toast('All information cleared.');
}

   5. BUILDER FORM RENDERING
   ========================================================================== */

var onDataChange = debounce(function () {
  renderPreview();
  saveResume(true);
}, 260);

/* ---------- Generic field ---------- */
function field(labelText, path, type, placeholder, opts) {
  opts = opts || {};
  var id = 'f_' + path.replace(/[^a-z0-9]/gi, '_');
  var wrap = h('div', { class: 'field' + (opts.full ? ' full' : '') });
  wrap.appendChild(h('label', { for: id, text: labelText }));

  var input;
  if (type === 'textarea') {
    input = h('textarea', { id: id, rows: opts.rows || 3, placeholder: placeholder || '' });
    input.value = getPath(state, path) || '';
  } else {
    input = h('input', { id: id, type: type || 'text', placeholder: placeholder || '' });
    input.value = getPath(state, path) || '';
  }
  input.addEventListener('input', function () {
    setPath(state, path, input.value);
    onDataChange();
  });
  wrap.appendChild(input);

  if (opts.hint) wrap.appendChild(h('p', { class: 'hint', text: opts.hint }));
  return wrap;
}

/* ---------- Checkbox field ---------- */
function checkboxField(labelText, path) {
  var id = 'c_' + path.replace(/[^a-z0-9]/gi, '_');
  var wrap = h('label', { class: 'check', for: id });
  var cb = h('input', { type: 'checkbox', id: id });
  cb.checked = !!getPath(state, path);
  cb.addEventListener('change', function () {
    setPath(state, path, cb.checked);
    onDataChange();
  });
  wrap.appendChild(cb);
  wrap.appendChild(h('span', { text: labelText }));
  return wrap;
}

/* ---------- Card shell ---------- */
function card(id, title, children) {
  var c = h('section', { class: 'card', id: 'sec-' + id });
  var idx = SECTION_NAV.findIndex(function (s) { return s.id === id; }) + 1;
  c.appendChild(h('h2', { class: 'card-title' },
    h('span', { class: 'idx', text: String(idx) }),
    document.createTextNode(title)
  ));
  children.filter(Boolean).forEach(function (ch) { c.appendChild(ch); });
  return c;
}

/* ---------- Repeater item shell ---------- */
function repItem(title, bodyChildren, onRemove) {
  var item = h('div', { class: 'rep-item' });
  var head = h('div', { class: 'rep-head' });
  head.appendChild(h('span', { class: 'rep-title', text: title }));
  var removeBtn = h('button', {
    type: 'button', class: 'btn btn-danger btn-sm',
    'aria-label': 'Remove ' + title, text: 'Remove'
  });
  removeBtn.addEventListener('click', onRemove);
  head.appendChild(removeBtn);
  item.appendChild(head);
  bodyChildren.filter(Boolean).forEach(function (ch) { item.appendChild(ch); });
  return item;
}

/* ---------- Generic repeater ---------- */
function repeater(container, arr, renderItem, addLabel, factory) {
  function rebuild() {
    container.innerHTML = '';
    arr.forEach(function (item, i) {
      container.appendChild(renderItem(item, i, rebuild));
    });
    var add = h('button', { type: 'button', class: 'btn btn-ghost btn-sm add-btn', text: '+ ' + addLabel });
    add.addEventListener('click', function () {
      arr.push(factory());
      onDataChange();
      rebuild();
      var items = container.querySelectorAll('.rep-item');
      var last = items[items.length - 1];
      if (last) {
        var firstInput = last.querySelector('input, textarea');
        if (firstInput && typeof firstInput.focus === 'function') firstInput.focus();
      }
    });
    container.appendChild(add);
  }
  rebuild();
}

/* ---------- Tag input (skills) ---------- */
function tagInput(label, getArr) {
  var wrap = h('div', { class: 'tagbox' });
  wrap.appendChild(h('div', { class: 'tagbox-label', text: label }));
  var chips = h('div', { class: 'chips' });
  var row = h('div', { class: 'tagrow' });
  var input = h('input', { type: 'text', placeholder: 'Add a skill and press Enter…', 'aria-label': 'Add skill to ' + label });
  var addBtn = h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'Add' });

  function renderChips() {
    chips.innerHTML = '';
    var arr = getArr();
    arr.forEach(function (skill, i) {
      var chip = h('span', { class: 'chip' });
      chip.appendChild(document.createTextNode(skill));
      var x = h('button', {
        type: 'button', class: 'chip-x', 'aria-label': 'Remove ' + skill, text: '×'
      });
      x.addEventListener('click', function () {
        arr.splice(i, 1);
        renderChips();
        onDataChange();
      });
      chip.appendChild(x);
      chips.appendChild(chip);
    });
  }

  function commit() {
    var v = input.value.trim();
    if (!v) return;
    var arr = getArr();
    v.split(',').map(function (s) { return s.trim(); }).filter(Boolean).forEach(function (s) {
      if (arr.indexOf(s) === -1) arr.push(s);
    });
    input.value = '';
    renderChips();

/* ---------- Image resize helper ---------- */
function resizeImage(dataUrl, maxSize, cb) {
  var img = new Image();
  img.onload = function () {
    var w = img.naturalWidth || img.width;
    var h2 = img.naturalHeight || img.height;
    if (!w || !h2) { cb(dataUrl); return; }
    var scale = Math.min(1, maxSize / Math.max(w, h2));
    var tw = Math.max(1, Math.round(w * scale));
    var th = Math.max(1, Math.round(h2 * scale));
    var canvas = document.createElement('canvas');
    canvas.width = tw;
    canvas.height = th;
    var ctx = canvas.getContext('2d');
    if (!ctx) { cb(dataUrl); return; }
    ctx.drawImage(img, 0, 0, tw, th);
    try { cb(canvas.toDataURL('image/jpeg', 0.88)); }
    catch (e) { cb(dataUrl); }
  };
  img.onerror = function () { cb(dataUrl); };
  img.src = dataUrl;
}

/* ============================================================================
   6. RESUME RENDERING
   ========================================================================== */

function buildCustomTheme() {
  var c = state.meta.custom;
  var fonts = { sans: SANS, serif: SERIF, mono: MONO, humanist: HUMANIST };
  var bg = c.bg || '#ffffff';
  var text = c.text || '#151a24';
  var primary = c.primary || '#4f46e5';
  var secondary = c.secondary || '#111827';
  var dark = luminance(bg) < 0.5;

  return {
    name: 'Custom',
    layout: c.layout === 'sidebar' ? 'sidebar' : 'single',
    header: 'band',
    divider: c.divider || 'bar',
    radius: '8px',
    font: fonts[c.font] || SANS,
    vars: {
      bg: bg,
      text: text,
      surface: dark ? shade(bg, 10) : shade(bg, -4),
      muted: dark ? shade(text, -34) : shade(text, 36),
      accent: primary,
      accent2: dark ? shade(text, -8) : secondary,
      border: dark ? shade(bg, 20) : shade(bg, -12),
      headerBg: dark ? shade(bg, 8) : secondary,
      headerText: contrastText(dark ? shade(bg, 8) : secondary),
      chipBg: dark ? shade(primary, -70) : shade(primary, 88),
      chipText: dark ? shade(primary, 35) : shade(primary, -38)
    }
  };
}

function activeTheme() {
  if (state.meta.themeId === 'custom') return buildCustomTheme();
  return THEMES[state.meta.themeId] || THEMES.amazon;
}

function applyTheme(el, t) {
  var v = t.vars;
  var map = {
    '--r-bg': v.bg, '--r-surface': v.surface, '--r-text': v.text, '--r-muted': v.muted,
    '--r-accent': v.accent, '--r-accent2': v.accent2, '--r-border': v.border,
    '--r-header-bg': v.headerBg, '--r-header-text': v.headerText,
    '--r-chip-bg': v.chipBg, '--r-chip-text': v.chipText,
    '--r-font': t.font, '--r-radius': t.radius
  };
  Object.keys(map).forEach(function (k) { el.style.setProperty(k, map[k]); });
  el.dataset.layout = t.layout;
  el.dataset.header = t.header;
  el.dataset.divider = t.divider;
  if (t.flag) el.dataset.flag = t.flag;
  else el.removeAttribute('data-flag');
}

/* ---------- Smart skill grouping ---------- */
function detectCategoryForSkill(skill) {
  var key = String(skill || '').trim().toLowerCase();
  if (!key) return null;
  if (TECH_BY_LABEL[key]) return TECH_BY_LABEL[key].group;
  var found = null;
  TECH_DICT.forEach(function (t) {
    if (found) return;
    if (t.re.test(key)) found = t.group;
  });
  return found;
}

function smartGroupSkills(skills) {
  var out = {};
  SKILL_CATEGORIES.forEach(function (c) { out[c] = []; });

  Object.keys(skills).forEach(function (cat) {
    var arr = skills[cat] || [];
    arr.forEach(function (raw) {
      var skill = String(raw || '').trim();
      if (!skill) return;
      var target = cat;

      /* Only re-classify entries the user left in "Other" or an unknown bucket. */
      if (cat === 'Other' || !out[cat]) {
        var detected = detectCategoryForSkill(skill);
        if (detected) target = detected;
      }
      if (!out[target]) out[target] = [];
      if (out[target].indexOf(skill) === -1) out[target].push(skill);
    });
  });

  Object.keys(out).forEach(function (k) {
    if (!out[k].length) delete out[k];
  });
  return out;
}

/* ---------- Skills ---------- */
function renderSkills(d) {
  var groups = smartGroupSkills(d.skills);
  var keys = Object.keys(groups);
  if (!keys.length) return null;

  var isAts = d.meta.ats === true;
  var children = [];

  if (isAts) {
    keys.forEach(function (k) {
      children.push(h('p', { class: 'ats-line' },
        h('strong', { text: k + ': ' }),
        document.createTextNode(groups[k].join(', '))
      ));
    });
  } else {
    var list = h('div', { class: 'skill-list' });
    keys.forEach(function (k) {
      var row = h('div', { class: 'skill-row' });
      row.appendChild(h('span', { class: 'skill-cat', text: k }));
      var chips = h('div', { class: 'skill-chips' });
      groups[k].forEach(function (s) { chips.appendChild(h('span', { class: 'skill-chip', text: s })); });
      row.appendChild(chips);
      list.appendChild(row);
    });
    children.push(list);
  }

  return sectionShell('Technical Skills', children);
}

/* ---------- Experience ---------- */
function renderExperience(d) {
  var items = d.experience.filter(function (e) {
    return e && (hasText(e.company) || hasText(e.title) || hasText(e.description));
  });
  if (!items.length) return null;

  var children = items.map(function (e) {
    var item = h('div', { class: 'r-item exp-item' });
    var head = h('div', { class: 'r-item-head' });
    var left = h('div', { class: 'r-item-left' });
    if (hasText(e.title)) left.appendChild(h('h3', { class: 'r-h3', text: e.title }));
    if (hasText(e.company) || hasText(e.location)) {
      left.appendChild(h('div', {
        class: 'r-org',
        text: [e.company, e.location].filter(hasText).join(' · ')
      }));
    }
    head.appendChild(left);

    var range = dateRange(e.start, e.end, e.current);
    if (range) {
      var right = h('div', { class: 'r-item-right' });
      right.appendChild(h('span', { class: 'r-date', text: range }));
      head.appendChild(right);
    }
    item.appendChild(head);

    lines(e.description).forEach(function (l) {
      item.appendChild(h('p', { class: 'r-para', text: l }));
    });

    var b = bullets(lines(e.achievements));
    if (b) item.appendChild(b);

    var techs = splitCommas(e.technologies);
    if (techs.length && d.meta.ats !== true) {
      var row = h('div', { class: 'r-tech' });
      row.appendChild(h('span', { class: 'r-tech-label', text: 'Tech' }));
      techs.forEach(function (tx) { row.appendChild(h('span', { class: 'r-tech-item', text: tx })); });
      item.appendChild(row);
    } else if (techs.length) {
      item.appendChild(h('p', { class: 'ats-line' },
        h('strong', { text: 'Technologies: ' }),
        document.createTextNode(techs.join(', '))
      ));
    }

    return item;
  });

  return sectionShell('Work Experience', children);
}

/* ---------- Projects ---------- */
function renderProjects(d) {
  var items = d.projects.filter(function (p) {
    return p && (hasText(p.name) || hasText(p.description));
  });
  if (!items.length) return null;

  var children = items.map(function (p) {
    var item = h('div', { class: 'r-item proj-item' });
    var head = h('div', { class: 'r-item-head' });
    var left = h('div', { class: 'r-item-left' });
    left.appendChild(h('h3', { class: 'r-h3', text: p.name || 'Project' }));

    var techs = splitCommas(p.technologies);
    if (techs.length) left.appendChild(h('div', { class: 'r-org', text: techs.join(' · ') }));
    head.appendChild(left);

    if (hasText(p.url)) {
      var url = sanitizeUrl(p.url);
      if (url) {
        var right = h('div', { class: 'r-item-right' });
        right.appendChild(h('a', {
          class: 'r-link', href: url, target: '_blank', rel: 'noopener noreferrer',
          text: prettyUrl(p.url)
        }));
        head.appendChild(right);
      }
    }
    item.appendChild(head);

    lines(p.description).forEach(function (l) {
      item.appendChild(h('p', { class: 'r-para', text: l }));
    });

    if (hasText(p.architecture)) {
      item.appendChild(h('p', { class: 'r-para' },
        h('strong', { text: 'Architecture: ' }),
        document.createTextNode(p.architecture.trim())
      ));
    }

    var b = bullets(lines(p.contributions));
    if (b) item.appendChild(b);

    return item;
  });

  return sectionShell('Technical Projects', children);
}

/* ---------- Education ---------- */
function renderEducation(d) {
  var items = d.education.filter(function (e) {
    return e && (hasText(e.degree) || hasText(e.university));
  });
  if (!items.length) return null;

  var children = items.map(function (e) {
    var item = h('div', { class: 'r-item edu-item' });
    var head = h('div', { class: 'r-item-head' });
    var left = h('div', { class: 'r-item-left' });
    if (hasText(e.degree)) left.appendChild(h('h3', { class: 'r-h3', text: e.degree }));
    if (hasText(e.university) || hasText(e.location)) {
      left.appendChild(h('div', {
        class: 'r-org',
        text: [e.university, e.location].filter(hasText).join(' · ')
      }));
    }
    head.appendChild(left);

    var range = dateRange(e.startYear, e.endYear, false);
    if (range || hasText(e.gpa)) {
      var right = h('div', { class: 'r-item-right' });
      if (range) right.appendChild(h('span', { class: 'r-date', text: range }));
      if (hasText(e.gpa)) {
        right.appendChild(h('div', { class: 'r-date', style: { marginTop: '2px' }, text: e.gpa }));
      }
      head.appendChild(right);
    }
    item.appendChild(head);

    if (hasText(e.coursework)) {
      item.appendChild(h('p', { class: 'r-para' },
        h('strong', { text: 'Relevant Coursework: ' }),
        document.createTextNode(e.coursework.trim())
      ));
    }
    return item;
  });

  return sectionShell('Education', children);
}

/* ---------- Simple list sections ---------- */
function renderSimpleSection(title, arr, plain) {
  var items = (arr || []).map(function (s) { return String(s || '').trim(); }).filter(Boolean);
  if (!items.length) return null;
  return sectionShell(title, [bullets(items, plain)]);
}

/* ---------- Custom sections ---------- */
function renderCustomSections(d) {
  return d.custom.map(function (cs) {
    if (!cs || !hasText(cs.title)) return null;
    var items = lines(cs.content);
    if (!items.length) return null;
    var children = items.map(function (l) { return h('p', { class: 'r-para', text: l }); });
    return sectionShell(cs.title.trim(), children);
  }).filter(Boolean);
}

/* ---------- Body layout ---------- */
function buildBody(d, t) {
  var body = h('div', { class: 'r-body' });

  var S = {
    summary:      renderSummary(d),
    skills:       renderSkills(d),
    tech:         d.meta.ats ? null : renderTechnologyEcosystem(d),
    experience:   renderExperience(d),
    projects:     renderProjects(d),
    education:    renderEducation(d),
    certs:        renderSimpleSection('Certifications', d.certifications, true),
    achievements: renderSimpleSection('Achievements', d.achievements, false),
    publications: renderSimpleSection('Publications', d.publications, true),
    languages:    renderSimpleSection('Languages', d.languages, true),
    custom:       renderCustomSections(d)
  };

  if (t.layout === 'sidebar') {
    var side = h('div', { class: 'r-col r-side' });
    var main = h('div', { class: 'r-col r-main' });

    [S.skills, S.education, S.certs, S.languages].forEach(function (n) {
      if (n) side.appendChild(n);
    });
    [S.summary, S.tech, S.experience, S.projects, S.achievements, S.publications]
      .concat(S.custom)
      .forEach(function (n) { if (n) main.appendChild(n); });

    if (!side.children.length) {
      body.classList.add('r-body-single');
      var merged = h('div', { class: 'r-col r-main' });
      [S.summary, S.tech, S.experience, S.projects, S.achievements, S.publications]
        .concat(S.custom)
        .forEach(function (n) { if (n) merged.appendChild(n); });
      body.appendChild(merged);
    } else {
      body.appendChild(side);
      body.appendChild(main);
    }
  } else {
    var single = h('div', { class: 'r-col r-main' });
    [S.summary, S.tech, S.skills, S.experience, S.projects, S.education,
     S.certs, S.achievements, S.publications, S.languages]
      .concat(S.custom)
      .forEach(function (n) { if (n) single.appendChild(n); });
    body.appendChild(single);
  }

  return body;
}

/* ---------- Full resume ---------- */
function buildResume(d) {
  var t = d.meta.ats ? ATS_THEME : activeTheme();
  var root = h('div', { class: 'resume' });
  applyTheme(root, t);
  root.appendChild(buildHeader(d, t));
  root.appendChild(buildBody(d, t));
  return root;
}

function renderPreview() {
  var host = $('#resumeHost');
  if (!host) return;
  var node = buildResume(state);
  host.innerHTML = '';
  host.appendChild(node);
}

/* ============================================================================
   7. TECHNOLOGY DETECTION & DIAGRAMS
   ========================================================================== */

function collectText(d) {
  var parts = [];
  parts.push(d.summary || '');
  Object.keys(d.skills || {}).forEach(function (k) {
    parts.push((d.skills[k] || []).join(' '));
  });
  (d.experience || []).forEach(function (e) {
    parts.push(e.title, e.company, e.description, e.achievements, e.technologies);
  });
  (d.projects || []).forEach(function (p) {
    parts.push(p.name, p.description, p.technologies, p.architecture, p.contributions);
  });
  (d.education || []).forEach(function (e) { parts.push(e.degree, e.coursework); });
  parts.push((d.certifications || []).join(' '));
  parts.push((d.achievements || []).join(' '));
  (d.custom || []).forEach(function (c) { parts.push(c.title, c.content); });
  return parts.filter(Boolean).join(' \n ');
}

/** Detect only technologies the user actually entered. */
function detectTechnologies(d) {
  var hay = collectText(d);
  if (!hay.trim()) return [];
  var found = [];
  TECH_DICT.forEach(function (entry) {
    if (entry.re.test(hay)) found.push(entry);
  });
  return found;
}

/** Build the technology ecosystem section for the current resume. */
function renderTechnologyEcosystem(d) {
  var det = detectTechnologies(d);
  if (!det.length) return null;

  var sec = h('section', { class: 'r-section' });
  sec.appendChild(h('h2', { class: 'r-h2', text: 'Technology Ecosystem' }));
  sec.appendChild(h('p', {
    class: 'r-note',
    text: 'Generated from the technologies listed in this resume.'
  }));

  var groups = {};
  det.forEach(function (t) {
    if (!groups[t.group]) groups[t.group] = [];
    if (groups[t.group].indexOf(t.label) === -1) groups[t.group].push(t.label);
  });

  var list = h('div', { class: 'skill-list' });
  Object.keys(groups).forEach(function (g) {
    var row = h('div', { class: 'skill-row' });
    row.appendChild(h('span', { class: 'skill-cat', text: g }));
    var chips = h('div', { class: 'skill-chips' });
    groups[g].forEach(function (label) {
      chips.appendChild(h('span', { class: 'skill-chip', text: label }));
    });
    row.appendChild(chips);
    list.appendChild(row);
  });
  sec.appendChild(list);

  var diagram = buildArchitecture(d, det);
  if (diagram) sec.appendChild(diagram);

  return sec;
}

/** Build the small, responsive architecture diagram. */
function buildArchitecture(d, det) {
  var keys = {};
  det.forEach(function (t) { keys[t.key] = t.label; });
  var has = function (k) { return Object.prototype.hasOwnProperty.call(keys, k); };
  var firstOf = function (list) {
    for (var i = 0; i < list.length; i++) { if (has(list[i])) return keys[list[i]]; }
    return null;
  };

  var steps = null;

  /* --- RAG pipeline --- */
  if (has('rag') || has('langchain') || has('embeddings') || has('vectordb') || has('llm')) {
    var embeddingModel = firstOf(['openai', 'azureoai', 'gemini', 'huggingface', 'bedrock']) || 'Embedding Model';
    var vectorStore = firstOf(['vectordb', 'elastic', 'postgres', 'mongodb']) || 'Vector Store';
    var llm = firstOf(['llm', 'gpt', 'openai', 'azureoai', 'gemini', 'bedrock']) || 'LLM';

    steps = [
      { label: 'Documents' },
      { label: 'Chunking' },
      { label: embeddingModel, note: 'embeddings' },
      { label: vectorStore },
      { label: 'Retriever', branches: [keys['rag'] ? 'RAG' : null, keys['langchain'] || null].filter(Boolean) },
      { label: llm },
      { label: 'Application' }
    ];
  }

  /* --- Machine-learning pipeline --- */
  if (!steps && (has('pytorch') || has('tensorflow') || has('keras') || has('sklearn') || has('cnn') || has('lstm') || has('gan') || has('dl') || has('ml'))) {
    var framework = firstOf(['pytorch', 'tensorflow', 'keras', 'sklearn']) || 'Model';
    steps = [
      { label: 'Data' },
      { label: 'Preprocessing' },
      { label: framework, note: 'training' },
      { label: 'Evaluation' },
      { label: 'Prediction' }
    ];
  }

  /* --- Microservices --- */
  if (!steps && (has('microsvc') || has('kubernetes') || has('kafka') || has('graphql') || has('grpc'))) {
    var backendTechs = ['fastapi', 'webapi', 'dotnet', 'flask', 'django', 'spring', 'nodejs', 'expressjs']
      .filter(has).map(function (k) { return keys[k]; });
    var dataTechs = ['mongodb', 'sqlserver', 'postgres', 'mysql', 'cassandra', 'dynamodb', 'cosmosdb', 'redis', 'kafka']
      .filter(has).map(function (k) { return keys[k]; });
    var runtime = firstOf(['kubernetes', 'ecs', 'eks', 'aks', 'gke', 'openshift']);

    steps = [
      { label: 'Client' },
      { label: firstOf(['apigw', 'restapi', 'graphql', 'grpc']) || 'API Gateway' },
      {
        label: has('microsvc') ? 'Microservices' : 'Services',
        branches: backendTechs.slice(0, 4)
      }
    ];
    if (runtime) steps.push({ label: runtime, note: 'runtime' });
    if (dataTechs.length) steps.push({ label: 'Data Stores', branches: dataTechs.slice(0, 4) });
    else steps.push({ label: 'Data Stores' });
  }

  /* --- Cloud-native --- */
  if (!steps && (has('aws') || has('azure') || has('gcp') || has('s3') || has('lambda') || has('cloudrun') ||
                 has('azfunc') || has('ec2') || has('firebase') || has('cloudstorage'))) {
    var compute = firstOf(['lambda', 'azfunc', 'cloudrun', 'ec2', 'ecs', 'eks', 'aks', 'gke', 'appinsights']) || 'Compute';
    var storage = firstOf(['s3', 'blob', 'cloudstorage']);
    var db2 = firstOf(['dynamodb', 'cosmosdb', 'azuresql', 'rds', 'sqlserver', 'postgres', 'mysql', 'mongodb', 'bigquery', 'snowflake']);
    var apiLayer = firstOf(['apigw', 'webapi', 'fastapi', 'flask', 'nodejs', 'expressjs', 'restapi']) || 'API Layer';

    steps = [
      { label: 'User' },
      { label: apiLayer },
      { label: compute }
    ];
    var cloudBranches = [];
    if (storage) cloudBranches.push(keys[storage]);
    if (db2) cloudBranches.push(keys[db2]);
    if (has('sqs')) cloudBranches.push(keys['sqs']);
    if (has('sns')) cloudBranches.push(keys['sns']);
    if (cloudBranches.length) steps[2].branches = cloudBranches.slice(0, 4);
    var obs = firstOf(['cloudwatch', 'appinsights', 'grafana', 'prometheus']);
    if (obs) steps.push({ label: obs, note: 'observability' });
  }

  /* --- Classic backend --- */
  if (!steps && (has('webapi') || has('fastapi') || has('flask') || has('django') || has('nodejs') ||
                 has('expressjs') || has('spring') || has('dotnet') || has('restapi'))) {
    var api = firstOf(['webapi', 'fastapi', 'flask', 'django', 'expressjs', 'nodejs', 'spring', 'dotnet', 'restapi']);
    var db3 = firstOf(['sqlserver', 'postgres', 'mysql', 'mongodb', 'dynamodb', 'cosmosdb', 'oracledb', 'sqlite', 'redis']);
    var client = firstOf(['angular', 'react', 'vue', 'nextjs']);

    steps = [
      { label: client || 'Client' },
      { label: api },
      { label: 'Service Layer' }
    ];
    if (db3) steps.push({ label: keys[db3], note: 'data' });
  }

  if (!steps || steps.length < 2) return null;

  return diagramNode('Architecture Overview', steps);
}

/** Render a compact, fully responsive architecture diagram (never overlaps text). */
function diagramNode(title, steps) {
  var box = h('div', {
    class: 'diagram',
    role: 'img',
    'aria-label': title + ': ' + steps.map(function (s) { return s.label; }).join(' to ')
  });
  box.appendChild(h('div', { class: 'dg-title', text: title }));

  var flow = h('div', { class: 'dg-flow' });
  steps.forEach(function (s, i) {
    var node = h('div', { class: 'dg-node' });
    node.appendChild(h('span', { text: s.label }));
    if (s.note) node.appendChild(h('span', { class: 'dg-note', text: '· ' + s.note }));
    flow.appendChild(node);

    if (s.branches && s.branches.length) {
      var br = h('div', { class: 'dg-branches' });
      s.branches.forEach(function (b) {
        if (!b) return;
        br.appendChild(h('span', { class: 'dg-branch', text: '↳ ' + b }));
      });
      if (br.children.length) flow.appendChild(br);
    }

    if (i < steps.length - 1) flow.appendChild(h('div', { class: 'dg-arrow', text: '↓' }));
  });

  box.appendChild(flow);
  return box;
}

/* ============================================================================
   8. VALIDATION, EXPORT, EVENTS & BOOTSTRAP
   ========================================================================== */

function validateForm() {
  var problems = [];
  var p = state.personal;

  if (!hasText(p.name)) problems.push('Full Name is required.');
  if (!hasText(p.title)) problems.push('Professional Title is required.');

  if (hasText(p.email) && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(p.email.trim())) {
    problems.push('Email address does not look valid.');
  }
  ['linkedin', 'github', 'portfolio'].forEach(function (k) {
    if (hasText(p[k]) && !sanitizeUrl(p[k])) {
      problems.push(p[k] + ' is not a valid URL.');
    }
  });
  (state.experience || []).forEach(function (e, i) {
    if (hasText(e.start) && hasText(e.end) && !e.current) {
      var ys = parseInt(String(e.start).match(/\d{4}/), 10);
      var ye = parseInt(String(e.end).match(/\d{4}/), 10);
      if (!isNaN(ys) && !isNaN(ye) && ye < ys) {
        problems.push('Experience #' + (i + 1) + ': end date is earlier than start date.');
      }
    }
  });
  return problems;
}

function printResume() {
  var problems = validateForm();
  if (problems.length) {
    toast(problems[0] + (problems.length > 1 ? ' (+' + (problems.length - 1) + ' more)' : ''));
    return;
  }
  window.print();
}

function downloadHTML() {
  var host = $('#resumeHost');
  var node = host ? host.firstElementChild : null;
  if (!node) { toast('Nothing to download yet.'); return; }

  var resumeCss = document.getElementById('resumeCss');
  var css = resumeCss ? resumeCss.textContent : '';
  var name = (state.personal.name || 'Resume').replace(/[^\w\s-]/g, '').trim() || 'Resume';

  var docCss = [
    'html,body{margin:0;padding:0;background:#eef1f6;}',
    'body{padding:24px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}',
    '.resume{margin:0 auto;}',
    '@media print{@page{size:A4;margin:10mm;}',
    'html,body{background:#fff;padding:0;}',
    '.resume{box-shadow:none !important;border-radius:0 !important;max-width:none !important;width:100% !important;}',
    '.r-section,.r-item,.exp-item,.proj-item,.edu-item,.diagram,.r-header{break-inside:avoid;page-break-inside:avoid;}',
    '*{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;}}'
  ].join('\n');

  var html =
    '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8" />\n' +
    '<meta name="viewport" content="width=device-width, initial-scale=1" />\n' +
    '<title>' + esc(name) + ' — Resume</title>\n' +
    '<style>\n' + css + '\n' + docCss + '\n</style>\n</head>\n<body>\n' +
    node.outerHTML +
    '\n</body>\n</html>';

  var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = name.replace(/\s+/g, '_') + '_resume.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  toast('Resume HTML downloaded.');
}

/* ---------- Mode helpers ---------- */
function setMode(mode) {
  document.body.setAttribute('data-mode', mode);
  if (mode === 'resume') document.body.setAttribute('data-mobile-view', 'preview');
  var prev = $('#btnPreviewMode');
  var edit = $('#btnEditMode');
  if (prev) prev.disabled = (mode === 'resume');
  if (edit) edit.disabled = (mode !== 'resume');
}

function setMobileView(view) {
  document.body.setAttribute('data-mobile-view', view);
  var tb = $('#tabBuilder');
  var tp = $('#tabPreview');
  if (tb) tb.classList.toggle('active', view === 'builder');
  if (tp) tp.classList.toggle('active', view === 'preview');
}

/* ---------- Event wiring ---------- */
function bindGlobalEvents() {

  var btnSample = $('#btnSample');
  if (btnSample) btnSample.addEventListener('click', function () {
    state = sampleState();
    renderBuilder();
    renderPreview();
    syncThemeUI();
    onDataChange();
    toast('Sample resume loaded — all of this is example data.');
  });

  var btnSave = $('#btnSave');
  if (btnSave) btnSave.addEventListener('click', function () { saveResume(false); });

  var btnLoad = $('#btnLoad');
  if (btnLoad) btnLoad.addEventListener('click', function () { loadResume(false); });

  var btnClear = $('#btnClear');
  if (btnClear) btnClear.addEventListener('click', function () {
    if (window.confirm('Clear all resume information and remove it from this browser?')) {
      clearResume();
    }
  });

  var btnGenerate = $('#btnGenerate');
  if (btnGenerate) btnGenerate.addEventListener('click', function () {
    var problems = validateForm();
    if (problems.length) {
      toast(problems.join(' '));
      return;
    }
    setMode('resume');
    renderPreview();
    toast('Resume generated.');
  });

  var btnPreviewMode = $('#btnPreviewMode');
  if (btnPreviewMode) btnPreviewMode.addEventListener('click', function () {
    setMode('resume');
    renderPreview();
  });

  var btnEditMode = $('#btnEditMode');
  if (btnEditMode) btnEditMode.addEventListener('click', function () {
    setMode('split');
    setMobileView('builder');
  });

  var btnPrint = $('#btnPrint');
  if (btnPrint) btnPrint.addEventListener('click', printResume);

  var btnDownload = $('#btnDownload');
  if (btnDownload) btnDownload.addEventListener('click', downloadHTML);

  var atsToggle = $('#atsToggle');
  if (atsToggle) {
    atsToggle.checked = !!state.meta.ats;
    atsToggle.addEventListener('change', function () {
      state.meta.ats = atsToggle.checked;
      renderPreview();
      saveResume(true);
      toast(atsToggle.checked
        ? 'ATS-Friendly Mode ON — diagrams and decoration removed.'
        : 'Visual theme mode ON.');
    });
  }

  var themeSelect = $('#themeSelect');
  if (themeSelect) {
    Object.keys(THEMES).forEach(function (id) {
      themeSelect.appendChild(h('option', { value: id, text: THEMES[id].name }));
    });
    themeSelect.appendChild(h('option', { value: 'custom', text: 'Custom' }));
    themeSelect.value = state.meta.themeId;
    themeSelect.addEventListener('change', function () {
      selectTheme(themeSelect.value);
    });
  }

  var tabBuilder = $('#tabBuilder');
  if (tabBuilder) tabBuilder.addEventListener('click', function () { setMobileView('builder'); });

  var tabPreview = $('#tabPreview');
  if (tabPreview) tabPreview.addEventListener('click', function () { setMobileView('preview'); });

  /* Keyboard shortcut: Ctrl/Cmd + P triggers the styled print path. */
  window.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 'P')) {
      var problems = validateForm();
      if (problems.length) {
        e.preventDefault();
        toast(problems[0]);
      }
    }
  });
}

/* ---------- Bootstrap ---------- */
function init() {
  var loaded = loadResume(true);
  if (!loaded) {
    state = emptyState();
  }

  renderBuilder();
  renderPreview();
  syncThemeUI();
  bindGlobalEvents();
  setMode('split');
  setMobileView('builder');

  var atsToggle = $('#atsToggle');
  if (atsToggle) atsToggle.checked = !!state.meta.ats;
  var themeSelect = $('#themeSelect');
  if (themeSelect) themeSelect.value = state.meta.themeId;

  if (!loaded) {
    toast('Welcome — start typing, or load the sample resume.');
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
